const list = document.getElementById('list');
const q = document.getElementById('q');
const stats = document.getElementById('stats');
const filters = document.getElementById('filters');
document.getElementById('total').textContent = DATA.length;
let activeProvince = '全部';
const provinces = ['全部', ...new Set(DATA.map(d => d.province))];
provinces.forEach(p => {
  const c = document.createElement('div');
  c.className = 'chip' + (p === '全部' ? ' active' : '');
  c.textContent = p;
  c.onclick = () => { activeProvince = p; document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); render(); };
  filters.appendChild(c);
});
function render() {
  const kw = q.value.trim();
  let rows = DATA.filter(d => activeProvince === '全部' || d.province === activeProvince);
  if (kw) rows = rows.filter(d => (d.name+d.city+d.province).includes(kw));
  stats.textContent = '显示 ' + rows.length + ' 家';
  if (!rows.length) { list.innerHTML = '<div class="empty">没有匹配的医院</div>'; return; }
  list.innerHTML = rows.map(d => '<div class="item"><div class="name">' + d.name + '</div><div class="meta">📍 ' + d.province + ' · ' + d.city + '</div></div>').join('');
}
q.addEventListener('input', render);
render();
